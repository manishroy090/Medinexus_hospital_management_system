
services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: manish
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: healthcare
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manish -d healthcare"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
     test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/server', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
     interval : 10s
     timeout : 40s
     retries : 3
     start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: frontend
    networks:
      - app-network
    expose:
     - "3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
     test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/auth/login', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
     interval : 10s
     timeout : 5s
     retries : 3

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend: 
        condition: service_healthy
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin



volumes:
  postgres_data:
  pgadmin_data:

networks:
 app-network:
  driver: bridge
